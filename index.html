<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1793d1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Nando Player</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>▶ Nando Player</h1>
    <button id="btn-open">📁 Abrir carpeta</button>
  </header>

  <div id="now-playing">
    <img id="track-art" src="nando.jpg" alt="cover">
    <p id="track-title">Sin pista</p>
    <p id="track-index">— / —</p>

    <div id="progress-wrap">
      <span id="time-current">0:00</span>
      <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1">
      <span id="time-total">0:00</span>
    </div>
  </div>

  <div id="controls">
    <button class="ctrl-btn" id="btn-shuffle" title="Aleatorio">🔀</button>
    <button class="ctrl-btn" id="btn-prev" title="Anterior">⏮</button>
    <button class="ctrl-btn" id="btn-play" title="Play/Pausa">▶</button>
    <button class="ctrl-btn" id="btn-next" title="Siguiente">⏭</button>
    <button class="ctrl-btn" id="btn-repeat" title="Repetir">🔁</button>
  </div>

  <div id="volume-wrap">
    <span>🔈</span>
    <input type="range" id="volume-bar" min="0" max="100" value="80" step="1">
    <span>🔊</span>
  </div>

  <div id="playlist-wrap">
    <div id="empty">
      <span class="icon">🎵</span>
      <p>Pulsa "Abrir carpeta" y selecciona tu música</p>
    </div>
    <ul id="playlist"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
